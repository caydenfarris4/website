<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#faf6ef">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='14' fill='%231c1208'/%3E%3Ctext x='50' y='68' font-family='Georgia,serif' font-size='52' font-weight='600' fill='%23b8840a' text-anchor='middle'%3ECF%3C/text%3E%3C/svg%3E">
<title>Page not found — Cayden Farris</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Lora:wght@0,400;0,500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --cream:#faf6ef;--gold:#b8840a;--gold-lt:#d4a832;
  --espresso:#1c1208;--brown:#4a2e12;--brown-lt:#7a5230;
  --muted:#8a7060;--border:rgba(74,46,18,0.12);
  --ff-head:'Cormorant Garamond',Georgia,serif;
  --ff-body:'Lora',Georgia,serif;
}
a:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
body{background:var(--cream);color:var(--espresso);font-family:var(--ff-body);min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden}
body::before{content:'';position:fixed;inset:0;pointer-events:none;opacity:.05;background-image:linear-gradient(var(--gold) 1px,transparent 1px),linear-gradient(90deg,var(--gold) 1px,transparent 1px);background-size:32px 32px;-webkit-mask-image:radial-gradient(ellipse 80% 80% at 50% 45%,black 30%,transparent 75%);mask-image:radial-gradient(ellipse 80% 80% at 50% 45%,black 30%,transparent 75%)}
.wrap{text-align:center;max-width:560px;position:relative}
.code{font-family:var(--ff-head);font-size:clamp(90px,20vw,150px);font-weight:300;line-height:1;color:var(--espresso)}
.code em{font-style:italic;color:var(--gold)}
h1{font-family:var(--ff-head);font-size:clamp(24px,4vw,32px);font-weight:500;margin:14px 0 10px}
p{color:var(--brown-lt);font-size:16px;line-height:1.7;margin-bottom:32px}
.links{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.links a{font-family:var(--ff-body);font-size:12px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;text-decoration:none;padding:14px 26px;border-radius:2px;transition:all .2s}
.home{background:var(--espresso);color:var(--cream)}
.home:hover{background:var(--brown)}
.alt{border:1.5px solid var(--border);color:var(--espresso)}
.alt:hover{border-color:var(--gold);color:var(--gold)}
</style>
</head>
<body>
<div class="wrap">
  <div class="code">4<em>0</em>4</div>
  <h1>This page hasn’t been built</h1>
  <p>The address may have a typo, or the page moved. Everything worth reading is still standing.</p>
  <div class="links">
    <a href="/" class="home">Back to the site</a>
    <a href="/book" class="alt">The Book</a>
    <a href="/blog" class="alt">The Blog</a>
  </div>
</div>
</body>
</html>
